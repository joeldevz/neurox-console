# nginx config for neurox-console (served as static SPA + reverse proxy to backend).
#
# Works behind any TLS terminator (cloud LB, Caddy, Traefik) — this image only
# speaks HTTP on port 80. Clients talking to nginx directly should use TLS.

upstream neurox_backend {
    # Resolved by the compose network DNS — the service name is "app".
    # If deploying outside compose, override with the backend host:port.
    server app:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # Basic hardening headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Gzip static assets (nginx:alpine already has brotli disabled by default).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Max client body for potential file uploads to the backend.
    client_max_body_size 4m;

    # -------------------------------------------------------------------------
    # Backend proxies
    # -------------------------------------------------------------------------
    # /api/* → admin REST API (versioned + legacy).
    location /api/ {
        proxy_pass http://neurox_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # /oauth/* and /.well-known/* → OAuth 2.0 endpoints.
    location /oauth/ {
        proxy_pass http://neurox_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /.well-known/ {
        proxy_pass http://neurox_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /authorize (OAuth alias without /oauth prefix).
    location /authorize {
        proxy_pass http://neurox_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /mcp and /mcp/* — Streamable HTTP + SSE. SSE needs proxy_buffering off.
    location /mcp {
        proxy_pass http://neurox_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /mcp/ {
        proxy_pass http://neurox_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # /health + /ready → backend liveness/readiness (useful for LB probes).
    location = /health {
        proxy_pass http://neurox_backend;
    }
    location = /ready {
        proxy_pass http://neurox_backend;
    }

    # -------------------------------------------------------------------------
    # Static SPA
    # -------------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Cache immutable hashed assets aggressively.
    location ~* ^/assets/.+\.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — never cache index.html.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
